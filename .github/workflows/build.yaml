name: Build project

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-26.04
    steps:
      - name: Install system dependencies
        run: >
          sudo apt update
          && sudo apt install --yes --no-install-recommends libdbus-1-dev libgirepository1.0-dev
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af  # v1.0.7
        with:
          toolchain: ${{ matrix.rust }}
          override: true
          components: rustfmt, clippy
      - name: Check Rust version
        run: rustc --version
      - name: Build
        run: cargo build --verbose
      - name: Unit tests
        run: cargo test --verbose

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgirepository1.0-dev

      - name: Install cargo binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Check Cargo.toml format
        run: |
          cargo binstall cargo-sort@1.0.9 --no-confirm --disable-strategies compile
          cargo sort --check --check-format --workspace

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Find typos
        run: |
          cargo binstall typos-cli@1.29.5 --no-confirm --disable-strategies compile
          typos

      - name: Lint Markdown files
        run: |
          npm install -g markdownlint-cli@0.31.1
          markdownlint -c .markdownlint.yaml '**/*.md'

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: '.'

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          extra_args: --results=verified,unknown

      - name: Run pre-commit
        run: |
          pip install pre-commit==4.6.2
          pre-commit run --all-files
