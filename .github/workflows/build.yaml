name: Build project

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read

jobs:

  component_tests:
    name: Component Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Install system dependencies
        run: >
          sudo apt update
          && sudo apt install --yes --no-install-recommends libdbus-1-dev
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.75
          override: true
      - name: Check Rust version
        run: rustc --version
      - name: Build
        run: cargo build --verbose
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      - name: Run component tests
        run: docker compose -f tests/scripts/compose.yaml run component-tests --build --remove-orphans
        working-directory: .
