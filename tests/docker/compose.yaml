services:
  component-tests:
    build: .
    entrypoint: /workdir/tests/docker/entrypoint.sh
    volumes:
      - /dev:/dev
      - "${PWD}:/workdir"
    working_dir: /
    tmpfs:
      - /tmp
    security_opt:
      - label=apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    

 
